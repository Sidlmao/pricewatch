name: pages

# Publishes web/ (the app) to GitHub Pages whenever it changes.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config.js from repo variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT: ${{ vars.TELEGRAM_BOT }}
          CHECK_INTERVAL_MINUTES: ${{ vars.CHECK_INTERVAL_MINUTES || '5' }}
          MAX_ITEMS_PER_USER: ${{ vars.MAX_ITEMS_PER_USER || '100' }}
          CRON_MINUTES: "0,5,10,15,20,25,30,35,40,45,50,55"     # must match the schedule in check.yml (*/5)
        run: |
          cat > web/config.js <<CFG
          window.PW_CONFIG = {
            supabaseUrl: "${SUPABASE_URL}",
            supabaseAnonKey: "${SUPABASE_ANON_KEY}",
            telegramBot: "${TELEGRAM_BOT}",
            checkIntervalMinutes: ${CHECK_INTERVAL_MINUTES},
            maxItems: ${MAX_ITEMS_PER_USER},
            cronMinutes: [${CRON_MINUTES}],
          };
          CFG
          cat web/config.js
          # cache-bust: browsers cache Pages files for 10 min; tie the config URL to this commit
          sed -i "s#./config.js#./config.js?v=${GITHUB_SHA::8}#" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
