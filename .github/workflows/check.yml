name: price check

on:
  schedule:
    # Every 6 hours (UTC). Edit this one line to change the interval, e.g. "0 */3 * * *" for every 3h.
    # Note: GitHub may delay scheduled runs by up to ~15 minutes at busy times.
    - cron: "0 */6 * * *"
  workflow_dispatch:      # lets you press "Run workflow" in the Actions tab

# Never run two checks at once (they would both try to commit the DB).
concurrency:
  group: pricewatch
  cancel-in-progress: false

permissions:
  contents: write         # commit data/pricewatch.db back
  pages: write            # publish the dashboard
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: playwright install --with-deps chromium

      - name: Check prices
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          MY_PHONE: ${{ secrets.MY_PHONE }}
          NOTIFIER: ${{ vars.NOTIFIER || 'twilio' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check.py

      - name: Commit price history
        run: |
          git config user.name "pricewatch bot"
          git config user.email "pricewatch@users.noreply.github.com"
          git add data/pricewatch.db
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "price check $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs || true
            git push
          fi

      - name: Build dashboard
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
