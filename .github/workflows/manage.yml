name: manage items

# Add, remove, pause or resume an item from the GitHub UI: Actions > manage items > Run workflow.
# No git needed on your laptop.
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: What to do
        options: [add, remove, pause/resume]
        default: add
      url:
        description: Product URL (for add)
        required: false
      size:
        description: Size, e.g. M (optional)
        required: false
      target:
        description: Target price, e.g. 60 (optional; without it you get texted on any drop)
        required: false
      restock:
        type: boolean
        description: Also alert when the size comes back in stock
        default: false
      id:
        description: Item id (for remove / pause, shown as # on the dashboard)
        required: false

concurrency:
  group: pricewatch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Apply
        env:
          ACTION: ${{ inputs.action }}
          URL: ${{ inputs.url }}
          SIZE: ${{ inputs.size }}
          TARGET: ${{ inputs.target }}
          RESTOCK: ${{ inputs.restock }}
          ID: ${{ inputs.id }}
        run: |
          set -e
          case "$ACTION" in
            add)
              [ -n "$URL" ] || { echo "url is required for add"; exit 1; }
              args=(--add "$URL")
              [ -n "$SIZE" ] && args+=(--size "$SIZE")
              [ -n "$TARGET" ] && args+=(--target "$TARGET")
              [ "$RESTOCK" = "true" ] && args+=(--restock)
              python check.py "${args[@]}" ;;
            remove)
              [ -n "$ID" ] || { echo "id is required for remove"; exit 1; }
              python check.py --remove "$ID" ;;
            pause/resume)
              [ -n "$ID" ] || { echo "id is required"; exit 1; }
              python check.py --toggle "$ID" ;;
          esac
          python check.py --list

      - name: Commit
        run: |
          git config user.name "pricewatch bot"
          git config user.email "pricewatch@users.noreply.github.com"
          git add data/pricewatch.db
          git diff --cached --quiet || (git commit -m "manage: ${{ inputs.action }}" && git pull --rebase -X theirs && git push)

      - name: Check prices now
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml
